server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    # 1. เข้าหน้าเว็บปกติ -> ไปเอาไฟล์ React มาโชว์
    # (คำสั่ง try_files สำคัญมากสำหรับ React Router ทำให้ Refresh หน้าไม่พัง)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. ถ้าเรียก /api -> ส่งต่อให้ Node-RED (Port 1880)
    location /api/ {
        # ยิงไปหา Node-RED ที่รันบน Windows
        proxy_pass http://host.docker.internal:1880/api/;
        
        # ส่ง Header เดิมตามไปด้วย
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. ถ้าเรียก /ws (WebSocket) -> ส่งต่อให้ Node-RED
    location /ws/ {
        proxy_pass http://host.docker.internal:1880/ws/;
        
        # คาถาเปิดท่อ WebSocket (ห้ามขาด)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # 🔥 [เพิ่มเติม] ตั้งเวลาให้ท่อไม่ตัดเอง (สำคัญ!)
        # Nginx ชอบตัดสายถ้าไม่มีข้อมูลวิ่งเกิน 60 วิ บรรทัดนี้จะยื้อไว้ให้นานๆ
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}